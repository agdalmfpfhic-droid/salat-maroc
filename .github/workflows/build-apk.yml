# Génère l'APK automatiquement sur GitHub (sans installer Android Studio).
# Onglet « Actions » › « Construire l'APK » › « Run workflow ».
name: Construire l'APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write   # pour publier l'APK dans « Releases »

jobs:
  build:
    runs-on: ubuntu-24.04   # SDK Android déjà installé sur cette image
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Construire
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SalatMaroc-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publier l'APK (téléchargeable directement depuis le téléphone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SalatMaroc.apk
          gh release create "v1.0-${{ github.run_number }}" SalatMaroc.apk \
            --title "Salat Maroc 1.0 (version ${{ github.run_number }})" \
            --notes "Touchez SalatMaroc.apk pour le télécharger, puis ouvrez-le pour installer l'application." \
            --latest
